[gcode_macro LIGHTS_ON]
gcode:
    SET_PIN PIN=lights_pin VALUE=1.0

[gcode_macro LIGHTS_OFF]
gcode:
    SET_PIN PIN=lights_pin VALUE=0.0

[gcode_macro LIGHTS_TOGGLE]
gcode:
    {% set current = printer["output_pin lights_pin"].value %}
    {% if current == 1 %}
        LIGHTS_OFF
    {% else %}
        LIGHTS_ON
    {% endif %}

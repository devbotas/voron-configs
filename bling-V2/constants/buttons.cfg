[gcode_button extrude_button]
pin: ^!z:P1.20
press_gcode:
release_gcode:
    EXTRUDE DELTA=5
    
[gcode_button retract_button]
pin: ^!z:P1.21
press_gcode:
release_gcode:
    RETRACT DELTA=5
    
[gcode_button lights_button]
pin: ^!z:P1.22
press_gcode:
release_gcode:
    LIGHTS_TOGGLE

[gcode_button heat_button]
pin: ^!z:P1.23
press_gcode:
    {% set nozzle_target = printer.extruder.target %}
    {% if nozzle_target > 100 %}
        HEAT_BED TEMPERATURE=0
        HEAT_NOZZLE TEMPERATURE=0
    {% else %}
        HEAT_BED TEMPERATURE=100
        HEAT_NOZZLE TEMPERATURE=145
    {% endif %}

[gcode_button generic_button1]
pin: ^!z:P1.30
press_gcode:
release_gcode:
    MESSAGE TEXT="Generic Button 1"

[gcode_button generic_button2]
pin: ^!z:P0.28
press_gcode:
release_gcode:
    MESSAGE TEXT="Generic Button 2"

[gcode_button generic_button3]
pin: ^!z:P1.18
press_gcode:
release_gcode:
    MESSAGE TEXT="Generic Button 3"

[gcode_button generic_button4]
pin: ^!z:P1.19
press_gcode:
release_gcode:
    MESSAGE TEXT="Generic Button 4"


[stepper_x]
endstop_pin: nhk:gpio13
position_min: 0
position_endstop: 300
position_max: 300

[stepper_y]
endstop_pin: P1.28
position_min: 0
position_endstop: 300
position_max: 300

[stepper_z]
endstop_pin: probe:z_virtual_endstop
position_max: 260
position_min: -5

[probe]
pin: nhk:gpio10
x_offset: 0
y_offset: 0

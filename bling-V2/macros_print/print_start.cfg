[gcode_macro PRINT_START]
gcode:
    {% set BED = params.BED|default(0)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(0)|float %}
    
    USE_ABSOLUTE_COORDS

    MESSAGE TEXT='Preheating...'
    HEAT_NOZZLE TEMPERATURE=140
    HEAT_BED TEMPERATURE={BED}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={BED-2} MAXIMUM={BED+5}

    {% set homed = printer.toolhead.homed_axes %}
    {% if "xyz" not in homed %}
        MESSAGE TEXT='Homing'
        HOME ; This will drop nozzle temperature, if necessary. 
    {% else %}
        MESSAGE TEXT="Skipping homing"
    {% endif %}
    
    {% if not printer.quad_gantry_level.applied %}
        MESSAGE text='QGL-ing'
        QUAD_GANTRY_LEVEL
    {% else %}
        MESSAGE TEXT="Skipping QGL"
    {% endif %}

    MESSAGE TEXT='Homing Z again'
    HOME AXES='Z'
    
    MESSAGE text='Heating nozzle'
    HEAT_NOZZLE TEMPERATURE={EXTRUDER}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={EXTRUDER-2} MAXIMUM={EXTRUDER+5}
    
    MESSAGE text='Purging'
    LINE_PURGE

    MESSAGE TEXT='Off we go!'
[gcode_button power_loss]
pin: ~P1.0
press_gcode:
    {action_respond_info("Printer state is: " ~ printer.idle_timeout.state)}
    {% if printer.idle_timeout.state == "Printing" and printer.pause_resume.is_paused == false %}
        SET_LED LED=sb_leds RED=0 GREEN=1 BLUE=1 WHITE=0 INDEX=1     
        POWER_LOSS_PAUSE
        SET_GCODE_VARIABLE MACRO=POWER_LOSS_RESUME VARIABLE=bed_temperature VALUE={printer.heater_bed.target}
        SET_GCODE_VARIABLE MACRO=POWER_LOSS_RESUME VARIABLE=nozzle_temperature VALUE={printer.extruder.target}
        SET_GCODE_VARIABLE MACRO=POWER_LOSS_RESUME VARIABLE=x_position VALUE={printer.toolhead.position.x}
        SET_GCODE_VARIABLE MACRO=POWER_LOSS_RESUME VARIABLE=y_position VALUE={printer.toolhead.position.y}
        SET_GCODE_VARIABLE MACRO=POWER_LOSS_RESUME VARIABLE=z_position VALUE={printer.toolhead.position.z}
        HEAT_BED TEMPERATURE=0
        HEAT_NOZZLE TEMPERATURE=0
    {% endif %}
release_gcode:
    {action_respond_info("Printer state is: " ~ printer.idle_timeout.state)}
    {% if printer.pause_resume.is_paused %}
        SET_LED LED=sb_leds RED=1 GREEN=0 BLUE=0 WHITE=0 INDEX=1     
        POWER_LOSS_RESUME
    {% endif %}

[gcode_macro POWER_LOSS_PAUSE]
gcode:
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
    
    SAVE_GCODE_STATE NAME=POWER_LOSS_PAUSE_state
    BASE_PAUSE

    SET_FEEDRATE VALUE=1800
    
    RETRACT

    {% if printer.toolhead.position.z < (max_z - 30) %}
        {% set z_delta = 30.0 %}
    {% else %}
        {% set z_delta = max_z - printer.toolhead.position.z %}
    {% endif %}

    SET_FEEDRATE VALUE=3600

    MOVE_BY AXIS='Z' DELTA={z_delta}
    MOVE_TO AXIS='X' POSITION=0
    MOVE_TO AXIS='Y' POSITION=0
    
[gcode_macro POWER_LOSS_RESUME]
variable_bed_temperature: 0
variable_nozzle_temperature: 0
variable_x_position: 0
variable_y_position: 0
variable_z_position: 0
gcode:
    HEAT_BED TEMPERATURE={bed_temperature}
    HEAT_NOZZLE TEMPERATURE={nozzle_temperature}
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temperature - 2} MAXIMUM={bed_temperature + 5}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={nozzle_temperature - 2} MAXIMUM={nozzle_temperature + 5}

    SET_FEEDRATE VALUE=3600
    MOVE_TO AXIS='X' POSITION={x_position}
    MOVE_TO AXIS='Y' POSITION={y_position}
    MOVE_TO AXIS='Z' POSITION={z_position}

    SET_FEEDRATE VALUE=1800
    EXTRUDE
    RESTORE_GCODE_STATE NAME=POWER_LOSS_PAUSE_state MOVE=1
    BASE_RESUME
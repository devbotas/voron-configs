# Replacing default Filament submenu with my own one
[menu __main __filament __loadpla]
type: command
name: Load PLA
gcode:OC
    {menu.exit()}
    LOAD_PLA

[menu __main __filament __loadabs]
type: command
name: Load ABS
gcode:
    {menu.exit()}
    LOAD_ABS

[menu __main __filament _unloadpla]
type: command
name: Unload PLA
gcode:
    {menu.exit()}
    UNLOAD_PLA

[menu __main __filament __unloadabs]
type: command
name: Unload ABS
gcode:
    {menu.exit()}
    UNLOAD_ABS

[menu __main __temp __preheat_pla]
type: command
name: Preheat PLA
enable: {('extruder' in printer) and ('heater_bed' in printer)}
gcode:
    {menu.exit()}
    M104 S140
    M140 S60

[menu __main __temp __preheat_abs]
type: command
name: Preheat ABS
enable: {('extruder' in printer) and ('heater_bed' in printer)}
gcode:
    {menu.exit()}
    M104 S140
    M140 S100